name: openclaw
icon: openclaw
type: service
title: OpenClaw
options:
- version: '2026'
  tag: '2026-0.4.6'
labels:
- openclaw

endpoints:
- name: openclaw
  ports:
  - name: openclaw
    number: 18789
    protocol: http
    private: true
    main: true

configs:
- name: config
  title: OpenClaw config
  config: openclaw.js.tmpl
  filepath: /etc/gotpl/openclaw.json.tmpl

env:
- name: OPENCLAW_GATEWAY_CONTROLUI_ALLOWED_ORIGIN_JSON
  value: '["http://127.0.0.1:18789", "https://{{service.primaryHost}}", "http://{{service.host}}.{{instance.namespace}}.svc.cluster.local:{{service.mainPort.number}}"]'

tokens:
- name: gateway_token
  generate:
    regex: '[0-9a-z-]{32}'

volumes:
- name: data
  title: Data
  size: 1
  optional: false
  helm:
    labels: persistence.labels
    values:
    - name: persistence.enabled
      value: true
    - name: persistence.size
      value: '{{volumes.data.size}}Gi'
    # mandatory to use existing claim since this volume will have import function
    # we will mount different claim after import and doing it through sts's volumeclaimtemplates is not supported
# disabled due to missing imports (required for this to work – we create PVC manually instead of using volumeClaimTemplate)
#    - name: primary.persistence.existingClaim
#      value: '{{volumes.spool.claim}}'

helm:
  name: wodby
  source: oci://registry-1.docker.io/wodby/openclaw
  chart: oci://registry-1.docker.io/wodby/openclaw
  version: 0.1.0
  values:
  - name: gatewayToken
    value: '{{gateway_token}}'

workloads:
- name: main
  selector:
    matchLabels:
      app.kubernetes.io/instance: '{{helm.release}}'
  kind: statefulset
  primary: true
  helm:
    labels: podLabels
    annotations: podAnnotations
    volumes: extraVolumes
  containers:
  - name: openclaw
    image: wodby/openclaw
    helm:
      env: envVars
      resources: resources
      mounts: extraVolumeMounts
